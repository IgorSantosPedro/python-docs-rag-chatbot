<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Docs Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 800px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #58a6ff;
    }

    .logo svg { width: 24px; height: 24px; }

    button#reset-btn {
      font-size: 0.8rem;
      padding: 6px 14px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: transparent;
      color: #8b949e;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    button#reset-btn:hover { border-color: #58a6ff; color: #58a6ff; }

    /* ── Chat area ── */
    #messages {
      flex: 1;
      width: 100%;
      max-width: 800px;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Welcome placeholder */
    .welcome {
      margin: auto;
      text-align: center;
      color: #8b949e;
    }
    .welcome h2 { font-size: 1.4rem; margin-bottom: 8px; color: #e6edf3; }
    .welcome p  { font-size: 0.9rem; line-height: 1.6; }

    /* Message rows */
    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .msg-row.user  { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .avatar.bot  { background: #1f6feb; color: #fff; }
    .avatar.user { background: #238636; color: #fff; }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.bot  .bubble { background: #161b22; border: 1px solid #21262d; border-top-left-radius: 2px; }
    .msg-row.user .bubble { background: #1f6feb; border-top-right-radius: 2px; }

    /* Sources accordion */
    details.sources {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #8b949e;
    }
    details.sources summary {
      cursor: pointer;
      color: #58a6ff;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    details.sources summary::before { content: "▸"; transition: transform 0.15s; }
    details.sources[open] summary::before { transform: rotate(90deg); }
    details.sources ol {
      margin-top: 8px;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    details.sources li {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px 10px;
      line-height: 1.5;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #58a6ff;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input bar ── */
    #input-bar {
      width: 100%;
      max-width: 800px;
      padding: 16px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea#user-input {
      flex: 1;
      resize: none;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 10px 14px;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea#user-input:focus { border-color: #58a6ff; }
    textarea#user-input::placeholder { color: #484f58; }

    button#send-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: #1f6feb;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    button#send-btn:hover:not(:disabled) { background: #388bfd; }
    button#send-btn:disabled { background: #21262d; cursor: not-allowed; }
    button#send-btn svg { width: 18px; height: 18px; }

    #hint {
      text-align: center;
      font-size: 0.72rem;
      color: #484f58;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <!-- Python logo mark -->
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.9 2C9.18 2 7 3.74 7 5.9V8h5v1H4.6C2.6 9 1 10.79 1 13s1.6 4 3.6 4H6v-2.1C6 12.74 8.18 11 10.9 11H14c2.2 0 4-1.57 4-3.5V5.9C18 3.74 15.82 2 13.1 2h-1.2zM10 5.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#3b82f6"/>
      <path d="M12.1 22c2.72 0 4.9-1.74 4.9-3.9V16h-5v-1h7.4c2 0 3.6-1.79 3.6-4s-1.6-4-3.6-4H18v2.1C18 11.26 15.82 13 13.1 13H10c-2.2 0-4 1.57-4 3.5v2.6C6 21.26 8.18 23 10.9 23h1.2zm1.9-3.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="#facc15"/>
    </svg>
    Python Docs Chatbot
  </div>
  <button id="reset-btn" title="Iniciar nova conversa">↺ Nova conversa</button>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <h2>Olá! Como posso ajudar?</h2>
    <p>Faça perguntas sobre a documentação do Python.<br/>
       Estou indexando: introdução, estruturas de dados,<br/>funções built-in e tratamento de erros.</p>
  </div>
</div>

<div id="input-bar">
  <textarea id="user-input" rows="1" placeholder="Pergunte algo sobre Python…"></textarea>
  <button id="send-btn" title="Enviar (Enter)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
  </button>
</div>
<div id="hint">Enter para enviar &nbsp;·&nbsp; Shift+Enter para nova linha</div>

<script>
  const API = "http://localhost:8000";
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const resetBtn   = document.getElementById("reset-btn");
  const welcomeEl  = document.getElementById("welcome");

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeWelcome() {
    if (welcomeEl) welcomeEl.remove();
  }

  function appendMessage(role, text, sources = []) {
    removeWelcome();
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatar = document.createElement("div");
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === "user" ? "Eu" : "🐍";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    // Accordion de fontes (apenas para respostas do bot)
    if (role === "bot" && sources.length > 0) {
      const details = document.createElement("details");
      details.className = "sources";
      const summary = document.createElement("summary");
      summary.textContent = ` ${sources.length} fonte(s) consultada(s)`;
      const ol = document.createElement("ol");
      sources.forEach(s => {
        const li = document.createElement("li");
        li.textContent = s;
        ol.appendChild(li);
      });
      details.appendChild(summary);
      details.appendChild(ol);
      bubble.appendChild(details);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping() {
    removeWelcome();
    const row = document.createElement("div");
    row.className = "msg-row bot typing";
    row.id = "typing";
    row.innerHTML = `
      <div class="avatar bot">🐍</div>
      <div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    `;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  // ── Send ─────────────────────────────────────────────────────────────────────

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "44px";
    sendBtn.disabled = true;

    appendMessage("user", text);
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Erro HTTP ${res.status}`);
      }
      const data = await res.json();
      removeTyping();
      appendMessage("bot", data.answer, data.sources);
    } catch (err) {
      removeTyping();
      const isNetwork = err instanceof TypeError;
      const msg = isNetwork
        ? "⚠️ Não foi possível conectar ao servidor.\nAbra o app pelo start.bat e aguarde a inicialização."
        : `⚠️ Erro do servidor:\n${err.message}`;
      appendMessage("bot", msg);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── Reset ─────────────────────────────────────────────────────────────────────

  async function reset() {
    try {
      await fetch(`${API}/reset`, { method: "POST" });
    } catch (_) { /* ignora se offline */ }

    messagesEl.innerHTML = `
      <div class="welcome" id="welcome">
        <h2>Olá! Como posso ajudar?</h2>
        <p>Faça perguntas sobre a documentação do Python.<br/>
           Estou indexando: introdução, estruturas de dados,<br/>funções built-in e tratamento de erros.</p>
      </div>
    `;
    inputEl.focus();
  }

  // ── Auto-resize textarea ─────────────────────────────────────────────────────

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "44px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  // ── Keyboard shortcuts ───────────────────────────────────────────────────────

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener("click", send);
  resetBtn.addEventListener("click", reset);

  inputEl.focus();
</script>
</body>
</html>
